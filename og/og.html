<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#2a1a10;color:#f6ede2;font-family:"DM Sans",sans-serif;display:grid;grid-template-columns:520px 1fr;gap:40px;padding:56px 0 56px 64px;box-sizing:border-box}
.l{display:flex;flex-direction:column}
.dom{font-family:"JetBrains Mono",monospace;font-size:19px;color:#c2ab93}
.dom b{font-family:"Instrument Serif",serif;font-weight:400;font-size:44px;color:#f6ede2;margin-right:2px}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:128px;line-height:.9;margin:34px 0 0;letter-spacing:-.02em}
h1 i{font-style:normal;color:#f0b44c}
.sub{font-family:"Instrument Serif",serif;font-size:44px;color:#e7d3bd;margin-top:6px}
.tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px}
.tags span{font-size:20px;padding:7px 16px;border-radius:999px;background:#ffffff14;color:#f1e3d2}
.r{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;margin-right:0;padding-right:56px}
.r figure{margin:0;border-radius:14px;overflow:hidden;box-shadow:0 20px 40px -18px #000}
.r img{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
</style></head><body>
<div class="l">
  <div class="dom">food.sankhacooray.com · a research hub by Sankha Cooray</div>
  <h1>food<i>.</i></h1>
  <div class="sub">Food, drink &amp; taste</div>
  <div class="tags"><span>Drinks &amp; coffee</span><span>Cooking science</span><span>Allergen scanning</span><span>Sound of eating</span></div>
</div>
<div class="r">
  <figure><img src="../public/thumbs/cook.jpg"></figure>
  <figure><img src="../public/thumbs/trophe.jpg"></figure>
  <figure><img src="../public/thumbs/umami.jpg"></figure>
  <figure><img src="../public/thumbs/soundbites.jpg"></figure>
</div>
</body></html>
